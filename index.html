<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>telc Deutsch B2 — Days 1–4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Karla:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121311;
  --panel:#1a1b18;
  --line:#2c2e28;
  --text:#e9e5da;
  --text-dim:#a8a294;
  --text-faint:#7d786c;
  --accent:#c9a961;
  --accent-dim:#8a7440;
  --radius:3px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,169,97,0.06), transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(143,165,131,0.04), transparent 70%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Karla', sans-serif;
  font-size:17px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 32px 120px;}
header{
  padding:72px 0 48px;
  border-bottom:1px solid var(--line);
  margin-bottom:40px;
}
.eyebrow{
  font-size:12px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:22px;
}
h1{
  font-family:'Newsreader',serif;
  font-weight:400;
  font-size:clamp(38px,6vw,58px);
  line-height:1.1;
  letter-spacing:-0.015em;
  margin-bottom:14px;
}
h1 em{font-style:italic;color:var(--accent);}
.subtitle{color:var(--text-dim);font-size:19px;max-width:60ch;font-weight:300;}
.days{display:flex;flex-direction:column;gap:10px;}
a.day{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  background:var(--panel);
  text-decoration:none;
  color:inherit;
}
a.day:hover{border-color:var(--accent-dim);background:rgba(201,169,97,0.07);}
.day .n{
  font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600;flex-shrink:0;
}
.day .t{font-size:16px;color:var(--text);flex:1;}
.day .s{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0;}
a.day.ready .s{color:var(--accent-dim);}
a.day.soon{opacity:0.55;pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">telc Deutsch B2</div>
  <h1>Four days.<br><em>One exam.</em></h1>
  <p class="subtitle">Writing, then the three speaking parts. Open a day when it is ready.</p>
</header>

<nav class="days">
  <a class="day ready" href="telcb2-day1.html">
    <span class="n">Day 1</span>
    <span class="t">Writing · Schriftlicher Ausdruck</span>
    <span class="s">Ready</span>
  </a>
  <a class="day ready" href="telcb2-day2.html">
    <span class="n">Day 2</span>
    <span class="t">Speaking · Part 1</span>
    <span class="s">Ready</span>
  </a>
  <a class="day ready" href="telcb2-day3.html">
    <span class="n">Day 3</span>
    <span class="t">Speaking · Part 2</span>
    <span class="s">Ready</span>
  </a>
  <a class="day soon" href="telcb2-day4.html">
    <span class="n">Day 4</span>
    <span class="t">Speaking · Part 3</span>
    <span class="s">Soon</span>
  </a>
</nav>
</div>
</body>
</html>
